name: Test PyPI package

# Manually triggered check that the *published* moleditpy-job-manager
# distribution installs cleanly from PyPI and works -- the real wheel, not the
# repository's source tree. Run it from the Actions tab after a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'moleditpy-job-manager version to install (blank = latest on PyPI)'
        required: false
        default: ''
      extras:
        description: 'Install variant'
        type: choice
        options:
          - default
          - all
        default: all

permissions:
  contents: read

jobs:
  test-installed:
    name: ${{ inputs.extras }} on ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Resolve install spec
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          EXTRAS: ${{ inputs.extras }}
        run: |
          SPEC="moleditpy-job-manager"
          if [ "$EXTRAS" = "all" ]; then
            SPEC="${SPEC}[all]"
          fi
          if [ -n "$VERSION" ]; then
            SPEC="${SPEC}==${VERSION}"
          fi
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "Install spec: $SPEC"

      - name: Install from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$SPEC"
          python -m pip show moleditpy-job-manager

      - name: Smoke-test the installed package
        # From a temporary directory, so `import job_manager` cannot pick up
        # the checkout's job_manager/ folder.
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          EXTRAS: ${{ inputs.extras }}
          QT_QPA_PLATFORM: offscreen
        run: |
          cp scripts/smoke_test_installed.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python smoke_test_installed.py --extras "$EXTRAS" ${VERSION:+--version "$VERSION"}
