name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Every pytest run has --timeout (pytest-timeout): a test that hangs used to
# hold its job until it was cancelled, and a cancelled job keeps no log. Five
# minutes is far past any test's own bounded waits; past it, every thread's
# stack is dumped and the test fails, so the log names what was stuck.
jobs:
  # -------------------------------------------------------------------------
  # Standard unit tests — no external dependencies required
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Run tests with coverage
        # -n auto: the script-execution tests spend their time waiting on real
        # bash and PowerShell processes, so the suite parallelises almost
        # perfectly -- 88s to 28s locally. Each test owns its own temp
        # directory and its own processes, so there is nothing shared to race.
        run: python -m pytest tests/ -v --tb=short -n auto --timeout=300 --timeout-method=thread --cov=job_manager --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Windows — the only runner that can execute the PowerShell backend.
  #
  # The wrapper in schedulers/windows.py and the queue in remote_runner_ps.py
  # are a second implementation of exit-code detection in a second language,
  # and their tests gate themselves on os.name == "nt": correct, because
  # GitHub's Ubuntu images ship pwsh but have no cmd, no taskkill and no
  # Windows paths. Without this job that code is never run by CI at all.
  # -------------------------------------------------------------------------
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest pytest-xdist pytest-timeout PyQt6

      - name: Run the suite on Windows
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
          JOB_MANAGER_QT_DIAGNOSTICS: "1"
        run: python -m pytest tests/ -v --tb=short -n auto -rs --timeout=300 --timeout-method=thread

      - name: Preserve Windows Qt crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-qt-diagnostics
          path: qt-diagnostics-*.txt
          if-no-files-found: ignore

      - name: Fail if the Windows-only tests skipped
        env:
          QT_QPA_PLATFORM: offscreen
        # The gate is os.name plus a PowerShell on PATH. If either check ever
        # changes shape, this job would go green while running nothing -- which
        # is exactly the state it was added to end.
        run: |
          python -m pytest tests/test_windows_scheduler.py tests/test_remote_runner_ps.py `
            -k "TestItReallyRuns or TestItRunsWhatIsQueued" -q --no-header -rs > tier.log 2>&1
          type tier.log
          if (Select-String -Path tier.log -Pattern "skipped" -Quiet) {
            echo "::error::The PowerShell execution tests skipped; this job exists to run them."
            exit 1
          }

      # The rest of the suite runs offscreen, where a window has no HWND the
      # shell knows: the ITaskbarList3 vtable calls, the thumbnail-button
      # WM_COMMAND route and the tray would only ever meet stand-ins. Run once
      # more on the real platform, and fail if that tier skipped.
      - name: Task bar and tray on a real Windows desktop
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m pytest tests/test_win_taskbar_native.py tests/test_win_taskbar.py -v -rs --timeout=300 --timeout-method=thread > native.log 2>&1
          $code = $LASTEXITCODE
          type native.log
          if ($code -ne 0) { exit $code }
          if (Select-String -Path native.log -Pattern "test_win_taskbar_native.py::Test(TheComObject|TheBadge|TheMonitorWindow|TheHandOffForReal)\S* SKIPPED" -Quiet) {
            echo "::error::The native task bar tests skipped; this step exists to run them."
            exit 1
          }

  # -------------------------------------------------------------------------
  # GUI tests — real PyQt6, headless. Roughly half of this plugin is dialogs
  # and a QTimer-driven poller; the pytest-only job above skips all of it.
  # -------------------------------------------------------------------------
  test-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # paramiko is an optional backend, but its ~/.ssh/config handling is the
      # real SSHConfig parser -- a stub would test nothing, so those tests skip
      # themselves unless the package is actually here.
      - name: Install dependencies
        run: pip install pytest pytest-cov PyQt6 paramiko pytest-xdist pytest-timeout

      - name: Run the full suite with real Qt
        env:
          QT_QPA_PLATFORM: offscreen
        # -n auto: the script-execution tests spend their time waiting on real
        # bash and PowerShell processes, so the suite parallelises almost
        # perfectly -- 88s to 28s locally. Each test owns its own temp
        # directory and its own processes, so there is nothing shared to race.
        run: python -m pytest tests/ -v --tb=short -n auto --timeout=300 --timeout-method=thread --cov=job_manager --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Integration tests — clones the main MoleditPy app to enable real
  # PluginContext tests (TestWithRealPluginContext)
  # -------------------------------------------------------------------------
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      # Importing the main app at all needs PyQt6 *and* rdkit:
      # moleditpy/__init__.py reaches PyQt6.QtGui through utils/constants, and
      # the plugin_interface chain reaches rdkit. Without both, the real-context
      # tier can only ever skip itself.
      - name: Install dependencies
        run: pip install pytest pytest-cov PyQt6 rdkit pytest-timeout

      - name: Clone main MoleditPy application
        run: |
          git clone --depth 1 \
            https://github.com/HiroYokoyama/python_molecular_editor.git \
            ../python_molecular_editor

      - name: Install main app package (no heavy deps)
        run: |
          pip install -e ../python_molecular_editor/moleditpy \
            --no-deps --quiet || true

      - name: Run integration tests with real PluginContext
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        # -rs prints skip reasons: a silently skipped real-context tier looks
        # exactly like a passing one in the log.
        run: python -m pytest tests/test_plugin_integration.py tests/test_api.py -v -rs --timeout=300 --timeout-method=thread

      - name: Fail if the real-context tier did not actually run
        env:
          CI_MAIN_APP_SRC: ${{ github.workspace }}/../python_molecular_editor/moleditpy/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_plugin_integration.py \
            -k TestWithRealPluginContext -q --no-header -rs > tier.log 2>&1 || true
          cat tier.log
          if grep -q "skipped" tier.log; then
            echo "::error::The real-PluginContext tests skipped; this job exists to run them."
            exit 1
          fi
