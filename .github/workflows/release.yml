name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 4.0.0 — without leading v)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        # Through env, not interpolated into the script: a ${{ }} expansion is
        # pasted in before bash sees the line, and this job holds REGISTRY_PAT.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a[0-9]+|b[0-9]+|rc[0-9]+)?$ ]]; then
            echo "ERROR: invalid release version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify version matches plugin source
        run: python scripts/release_common.py verify --version "$VERSION"

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        # A mismatched manual version must fail before publishing a tag.
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build release package
        run: python scripts/release_common.py package --version "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_common.py publish --version "$VERSION"

      - name: Trigger moleditpy-plugins registry update
        if: success()
        continue-on-error: true
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: python scripts/release_common.py notify --version "$VERSION"
