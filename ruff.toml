# The oldest Python the registry offers this plugin to. Ruff uses it to
# reject syntax that would not parse there -- a backslash inside an
# f-string expression is legal from 3.12 only, and shipped a module that
# could not be imported at all on 3.11.
target-version = "py39"

line-length = 100

# Vendored from the other MoleditPy plugin repos and kept byte-identical so the
# shared API checker can be diffed across them; not ours to reformat.
exclude = ["tests/plugin_api_checker.py"]
